<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>HEY_BRYSON</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><div><b>HEY_BRYSON</b><small>multi-bot workspace</small></div></div>
    <nav id="nav">
      <button data-view="chat" class="active"><span>💬</span><em>Chat</em></button>
      <button data-view="brain"><span>🧠</span><em>Super Brain</em></button>
      <button data-view="bots"><span>🤖</span><em>Bots</em></button>
      <button data-view="idle"><span>🗣️</span><em>Idle Talk</em></button>
      <button data-view="history"><span>🕘</span><em>History</em></button>
      <button data-view="settings"><span>⚙️</span><em>Settings</em></button>
      <button id="mic-toggle" class="mic" title="Turn the “Hey Bryson” wake word on or off"><span>🎙️</span><em>Hey Bryson: off</em></button>
    </nav>
    <div id="usage" class="usage" title="Usage today (resets at midnight)"></div>
  </aside>
  <main id="main">
    <div id="banner" class="banner hidden"></div>
    <section id="view-chat" class="view active"></section>
    <section id="view-brain" class="view"></section>
    <section id="view-bots" class="view"></section>
    <section id="view-idle" class="view"></section>
    <section id="view-history" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="mic-pill" class="mic-pill hidden"></div>
<script>(function(){try{var m=location.hash.match(/[#&]setkey=([^&]+)/);if(!m)return;var k=decodeURIComponent(m[1]).trim();if(!/^sk-or-v1-[A-Za-z0-9]+$/.test(k))return;var o={};try{o=JSON.parse(localStorage.getItem("pearhub.keys")||"{}")||{}}catch(e){}o.openrouter=k;localStorage.setItem("pearhub.keys",JSON.stringify(o));history.replaceState(null,"",location.pathname+location.search);window.__keyAdded=1;addEventListener("load",function(){setTimeout(function(){alert("\u2705 OpenRouter key saved in this browser. You're all set!")},300)})}catch(e){}})();</script>
<script defer src="app.bundle.js"></script><!-- built from js/*.js: npx esbuild js/app.js --bundle --format=iife --outfile=app.bundle.js -->
</body>
</html>
